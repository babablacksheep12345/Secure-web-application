# Free deployment on Render — connect this repo at https://dashboard.render.com/blueprints
# Repo: https://github.com/Shikha-Upadhyay13/Secure-web-application

services:
  - type: web
    name: securevault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: securevault-db
          property: connectionString

databases:
  - name: securevault-db
    plan: free
    databaseName: securevault
    user: securevault
